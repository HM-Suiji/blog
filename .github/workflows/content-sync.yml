name: Content Sync

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'content/posts/**'
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload as JSON
        required: true
        type: string

jobs:
  sync:
    name: Sync posts to database
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # 拉取最新仓库内容
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 安装依赖
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 确认数据库环境变量存在
      # 不打印真实值，避免泄露 Neon 密码
      - name: Check DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is missing"
            exit 1
          fi

          echo "DATABASE_URL exists"

      # 同步文章
      # sync-posts 应该输出 JSON 到 stdout
      - name: Sync posts
        run: |
          bun run sync-posts > sync-result.json

      # 检查同步结果
      - name: Check sync result
        run: |
          cat sync-result.json

      # 通知 Next.js 刷新 ISR
      - name: Revalidate Next.js cache
        run: |
          curl \
            --fail \
            --request POST \
            "${{ secrets.NEXT_PUBLIC_HOST }}/api/revalidate" \
            --header "Authorization: Bearer ${{ secrets.REVALIDATE_SECRET }}" \
            --header "Content-Type: application/json" \
            --data-binary "@sync-result.json"
