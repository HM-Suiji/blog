name: Sync Posts

on:
  push:
    branches:
      - main

    paths:
      - 'content/posts/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Sync posts
        run: bun run sync-posts
